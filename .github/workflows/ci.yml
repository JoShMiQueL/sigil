name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RATE_LIMIT_DISABLED: "1"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      - run: pnpm check
      - run: pnpm typecheck

  unit-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      - run: pnpm --filter @sigilpanel/db db:generate
      - run: pnpm test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sigilpanel
          POSTGRES_PASSWORD: sigilpanel
          POSTGRES_DB: sigilpanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigilpanel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sigilpanel:sigilpanel@localhost:5432/sigilpanel
      REDIS_URL: redis://localhost:6379
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      - run: pnpm --filter @sigilpanel/db db:generate
      - run: pnpm --filter @sigilpanel/db db:migrate
      - name: Install Playwright browsers
        run: pnpm --filter @sigilpanel/panel exec playwright install --with-deps chromium
      - run: pnpm test:e2e
