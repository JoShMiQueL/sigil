name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check
      - run: bun run typecheck
      - name: Validate template YAML files
        run: bun apps/api/src/lib/validate-templates.ts

  unit-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun --filter @sigilpanel/db db:generate
      - run: bun run test

  daemon:
    name: Daemon Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Build daemon
        run: cd apps/daemon && go build ./...
      - name: Run unit tests
        run: cd apps/daemon && go test ./internal/... -v -short
      - name: Run integration tests
        run: cd apps/daemon && go test ./internal/... -v -tags integration -timeout 120s

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RATE_LIMIT_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(cd apps/panel && bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: bun --filter @sigilpanel/db db:generate
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd apps/panel && bunx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: cd apps/panel && bunx playwright install-deps chromium
      - run: bun run test:e2e
