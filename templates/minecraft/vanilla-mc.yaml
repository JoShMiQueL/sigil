name: Vanilla MC
description: Official Minecraft server (vanilla)
author: SigilPanel
version: "1.0.0"
image: eclipse-temurin:21-jre
startupCommand: java -Xms{{memoryMb}}M -Xmx{{memoryMb}}M -jar server.jar nogui
stopSignal: "^C"
environment:
  EULA: "false"
  SERVER_NAME: "My Vanilla Server"
  MAX_PLAYERS: "20"
  DIFFICULTY: "normal"
portMappings:
  - name: main
    protocol: tcp
    internalPort: 25565
    externalPort: 25565
resourceLimits:
  memoryMb: 1024
  cpuLimit: 1.0
  pidsLimit: 512
resourceLimitsRange:
  memoryMb:
    min: 512
    max: 4096
    recommended: 1024
  cpuLimit:
    min: 0.5
    max: 4.0
    recommended: 1.0
  pidsLimit:
    min: 128
    max: 1024
    recommended: 512
changelog:
  - version: "1.0.0"
    date: "2026-09-10"
    changes:
      - type: added
        description: "Initial release"
tags:
  - minecraft
  - java
  - vanilla
variables:
  - name: EULA
    envVar: EULA
    dataType: boolean
    defaultValue: "false"
    required: true
    visibility: editable
    sortOrder: 0
  - name: Server Name
    envVar: SERVER_NAME
    dataType: string
    defaultValue: "My Vanilla Server"
    required: true
    minLength: 1
    maxLength: 50
    visibility: editable
    sortOrder: 1
  - name: Max Players
    envVar: MAX_PLAYERS
    dataType: integer
    defaultValue: "20"
    required: true
    minValue: 1
    maxValue: 100
    visibility: editable
    sortOrder: 2
  - name: Difficulty
    envVar: DIFFICULTY
    dataType: select
    defaultValue: "normal"
    required: true
    allowedValues: ["peaceful", "easy", "normal", "hard"]
    visibility: editable
    sortOrder: 3
